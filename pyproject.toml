[project]
name = "pgwarehouse"
version = "0.1.5"
description = "Easily sync your Postgres database to your data warehouse."
authors = [{ name = "Scott Persinger", email = "scottpersinger@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.10"

dependencies = [
    "pyyaml>=6.0.3,<7",
    "python-dotenv>=1.2.4,<2",
    "clickhouse-driver>=0.2.11,<0.3",
    "psycopg2>=2.9.13,<3",
    "snowflake-connector-python>=4.8.0,<5",
    "tabulate>=0.10.0,<0.11",
    "duckdb>=1.5.6,<2",
]

[project.scripts]
pgwarehouse = "pgwarehouse.__main__:main"
pgwh = "pgwarehouse.__main__:main"

# Local dependencies for development
[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "testing-postgresql>=1.3.0,<2",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package lives at ./pgwarehouse rather than ./src/pgwarehouse
module-root = ""

[tool.uv.pip]
no-annotate = true
no-header = true
generate-hashes = false
no-strip-extras = true
