[project]
name = "pgwarehouse"
version = "0.1.5"
description = "Easily sync your Postgres database to your data warehouse."
authors = [{ name = "Scott Persinger", email = "scottpersinger@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.9"

dependencies = [
    "pyyaml>=6.0.1,<7",
    "python-dotenv>=1.0.1,<2",
    "clickhouse-driver>=0.2.7,<0.3",
    "psycopg2>=2.9.9,<3",
    "snowflake-connector-python>=3.10.0,<5.0.0",
    "tabulate>=0.9.0,<0.10",
    "duckdb>=0.10.2,<0.11",
]

[project.scripts]
pgwarehouse = "pgwarehouse.__main__:main"
pgwh = "pgwarehouse.__main__:main"

# Local dependencies for development
[dependency-groups]
dev = [
    "pytest>=8.2.0,<10.0.0",
    "testing-postgresql>=1.3.0,<2",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package lives at ./pgwarehouse rather than ./src/pgwarehouse
module-root = ""

[tool.uv.pip]
no-annotate = true
no-header = true
generate-hashes = false
no-strip-extras = true
