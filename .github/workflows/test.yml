name: Run tests

on:
  push:
    branches:
      - main
  pull_request:
  # Required checks on protected branches have to run in the merge queue as well.
  # See: https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#merge_group
  merge_group:
    branches: [ main ]

permissions:
  contents: read

jobs:
  run-tests:
    name: Tests (Python ${{ matrix.python-version }})
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # https://docs.astral.sh/uv/guides/integration/github/#setting-up-python
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.x"
          enable-cache: true
          prune-cache: true
          python-version: ${{ matrix.python-version }}

      # psycopg2 is built from source (needs libpq-dev), and testing.postgresql spawns the
      # runner's preinstalled Postgres server binaries, which are not on the PATH by default
      - name: Set up Postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev
          ls -d /usr/lib/postgresql/*/bin | tail -n 1 >> "$GITHUB_PATH"

      - name: Install dependencies
        run: make install

      - name: Run tests
        run: make test

  build-package:
    name: Build package
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.x"
          enable-cache: true
          prune-cache: true

      - name: Build sdist and wheel
        run: make build
